name: (테스트) KRX 종목 검색 화면 구조 확인

on:
  workflow_dispatch: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: 종목 검색 화면 구조 확인
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python3 scripts/inspect_stock_page.py

      - name: 스크린샷 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-stock-page-screenshots
          path: /tmp/krx_stock_page_step*.png
