name: 일별 기준주가 보고서 자동 발송

on:
  schedule:
    # 08:37 UTC = 17:37 KST, 월~금 (정각/30분처럼 몰리는 시각을 피해 지연 가능성을 줄임)
    - cron: "37 8 * * 1-5"
  workflow_dispatch: {}  # Actions 탭에서 수동 실행 버튼으로도 테스트 가능

permissions:
  contents: write

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 한글 폰트 설치
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum

      - name: 패키지 설치
        run: |
          pip install -r requirements.txt
          python3 -m playwright install --with-deps chromium

      - name: 파이프라인 실행 (다운로드 -> 계산 -> 보고서 -> 이메일)
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python3 main.py

      - name: 디버그 스크린샷 업로드 (조회기간 입력 디버깅용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-debug-snapshot
          path: data/debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: 갱신된 누적 데이터 커밋
        run: |
          git config user.name "krx-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.xlsx
          git diff --cached --quiet || git commit -m "기준주가 데이터 자동 갱신 $(date +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
