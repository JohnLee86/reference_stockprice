name: (테스트) KRX 실제 로그인 시도

on:
  workflow_dispatch: {}

jobs:
  login-test:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: |
          pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: 로그인 시도
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python3 scripts/krx_login_test.py

      - name: 스크린샷 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: krx-after-login-screenshot
          path: /tmp/krx_after_login.png
